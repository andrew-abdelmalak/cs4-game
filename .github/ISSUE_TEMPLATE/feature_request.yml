name: Feature request
description: Suggest an improvement to the game engine, console runner, or test suite.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or gameplay/testing gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen, keeping course reflection constraints in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds or other approaches.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with guidance"
        - "No"
    validations:
      required: true
