name: Bug report
description: Report something in the game engine or CLI that does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security problems, do not use this form; follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or test case that shows the problem.
      placeholder: |
        1. Run `mvn -q exec:java -Dexec.args="--demo"`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Run `git rev-parse --short HEAD` or check the release tag.
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, `java -version`, and `mvn -version`.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste any stack trace or Maven output. Remove any local paths or sensitive data first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
